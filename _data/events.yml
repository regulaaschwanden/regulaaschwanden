  - title: Familienstellen Workshop
    theme: Ein Raum für Heilung, Verständnis und neue Wege.
    text: Manchmal tragen wir Themen, die gar nicht zu uns gehören. In der
      Aufstellungsarbeit nehmen wir wahr, was da ist, erkennen Zusammenhänge und
      gehen neue, befreiende Wege. So darf sich lösen, was dich bisher
      zurückgehalten hat.
    datum: Samstag, 26.09.2026
    zeit: 10:00 – 17:00 Uhr
    leitung: Regula Aschwanden, erfahrene Therapeutin
