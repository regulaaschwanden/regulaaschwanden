  - title: 'Märchenseminar '
    theme: Frei und authentisch Geschichten erzählen
    text: BESCHREIBUNG In diesem Seminar lernen Sie, wie Märchen frei, lebendig und
      authentisch erzählt werden können. Im Mittelpunkt stehen dabei nicht nur
      die Inhalte der Geschichten, sondern vor allem die Körpersprache, Mimik,
      Gestik und Stimme. Sie erfahren, wie sie durch bewusste Präsenz, gezielte
      Ausdrucksformen und eine klare Erzählsprache eine Erzählatmosphäre
      schaffen, die Kinder wie Erwachsene gleichermassen berührt. Durch
      praktische Übungen wird das selbstsichere und natürliche Erzählen von
      Geschichten gefördert.
    datum: 25.10.2026
    zeit: 9:00 - 17:00 Uhr
    leitung: Regula Aschwanden
    ort: Laubstrasse 4 6430 Schwyz
    teilnehmerzahl: '10'
    kosten: CHF 150.00 inkl. Material
